<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#e04148">
<title>Zanzibar Trip 🌴</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  :root {
    --accent: #e04148;
    --accent-dark: #b8323a;
    --bg: #ffffff;
    --text: #1e2430;
    --muted: #6b7280;
    --card: #f6f7f9;
    --radius: 14px;
    --shadow: 0 4px 20px rgba(0,0,0,.15);
  }

  #map { position: absolute; inset: 0; z-index: 1; }

  /* ---- Top bar ---- */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 20;
    padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
    display: flex; align-items: center; gap: 8px;
    pointer-events: none;
  }
  .topbar .chip {
    pointer-events: auto;
    background: var(--bg); color: var(--text);
    border-radius: 999px; padding: 8px 14px;
    font-size: 14px; font-weight: 600;
    box-shadow: var(--shadow); border: none;
    display: flex; align-items: center; gap: 6px;
  }
  .chip.accent { background: var(--accent); color: #fff; }
  .chip.tracking { background: #16a34a; color: #fff; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .7; } }
  .spacer { flex: 1; }

  /* ---- Floating action buttons ---- */
  .fabs {
    position: absolute; right: 14px; z-index: 20;
    display: flex; flex-direction: column; gap: 12px;
    transition: bottom .25s ease;
  }
  .fab {
    width: 54px; height: 54px; border-radius: 50%;
    border: none; box-shadow: var(--shadow);
    font-size: 24px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
  }
  .fab.primary { background: var(--accent); color: #fff; width: 62px; height: 62px; font-size: 28px; }

  /* ---- Bottom sheet ---- */
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--bg);
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -6px 30px rgba(0,0,0,.18);
    transition: transform .28s cubic-bezier(.3,.9,.4,1);
    max-height: 78vh;
    display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet.collapsed { transform: translateY(calc(100% - 118px)); }
  .sheet-handle {
    padding: 10px 0 4px; display: flex; justify-content: center; cursor: pointer; flex: none;
  }
  .sheet-handle::before {
    content: ""; width: 44px; height: 5px; border-radius: 3px; background: #d3d7de;
  }
  .sheet-header { padding: 4px 20px 12px; flex: none; cursor: pointer; }
  .sheet-header h1 { font-size: 20px; color: var(--text); }
  .stats { display: flex; gap: 18px; margin-top: 6px; }
  .stat { font-size: 13px; color: var(--muted); }
  .stat b { color: var(--text); font-size: 15px; }
  .sheet-body { overflow-y: auto; padding: 0 16px 24px; -webkit-overflow-scrolling: touch; }

  /* ---- Step cards ---- */
  .step-card {
    background: var(--card); border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px; position: relative;
  }
  .step-card .num {
    position: absolute; top: -8px; left: -4px;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent); color: #fff;
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  .step-card h3 { font-size: 16px; color: var(--text); padding-left: 14px; }
  .step-card .date { font-size: 12px; color: var(--muted); padding-left: 14px; margin-top: 2px; }
  .step-card .notes { font-size: 14px; color: var(--text); margin-top: 8px; white-space: pre-wrap; }
  .photos { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
  .photos img {
    height: 92px; border-radius: 10px; flex: none; cursor: pointer;
  }
  .step-actions { display: flex; gap: 14px; margin-top: 10px; }
  .step-actions button {
    background: none; border: none; color: var(--muted);
    font-size: 13px; font-weight: 600; cursor: pointer; padding: 2px 0;
  }
  .step-actions button.danger { color: var(--accent); }
  .empty {
    text-align: center; color: var(--muted); padding: 30px 20px; font-size: 14px; line-height: 1.6;
  }

  /* ---- Modal ---- */
  .modal-wrap {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.45);
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-wrap.open { display: flex; }
  .modal {
    background: var(--bg); width: 100%; max-width: 520px;
    border-radius: 22px 22px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y: auto;
  }
  .modal h2 { font-size: 19px; margin-bottom: 16px; color: var(--text); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .field input[type=text], .field input[type=datetime-local], .field textarea {
    width: 100%; border: 1.5px solid #dde1e7; border-radius: 10px;
    padding: 11px 12px; font-size: 16px; font-family: inherit; color: var(--text); background: var(--bg);
  }
  .field textarea { min-height: 84px; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .loc-row { display: flex; gap: 8px; }
  .loc-btn {
    flex: 1; border: 1.5px solid #dde1e7; background: var(--bg); border-radius: 10px;
    padding: 10px 6px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .loc-btn.sel { border-color: var(--accent); color: var(--accent); background: #fdf0f0; }
  .photo-add {
    border: 1.5px dashed #c8cdd5; border-radius: 10px; padding: 14px;
    text-align: center; color: var(--muted); font-size: 14px; cursor: pointer;
    background: transparent; font-family: inherit;
  }
  .photo-previews { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .photo-previews .pp { position: relative; }
  .photo-previews img { height: 64px; border-radius: 8px; }
  .photo-previews .rm {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--text); color: #fff; border: none;
    font-size: 12px; line-height: 1; cursor: pointer;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn {
    flex: 1; border: none; border-radius: 12px; padding: 14px;
    font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:active { background: var(--accent-dark); }
  .btn.ghost { background: var(--card); color: var(--text); }

  /* ---- Photo lightbox ---- */
  .lightbox {
    position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.92);
    display: none; align-items: center; justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; }

  /* ---- Toast ---- */
  .toast {
    position: fixed; top: calc(64px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: var(--text); color: #fff; padding: 10px 18px;
    border-radius: 999px; font-size: 14px; z-index: 70;
    opacity: 0; transition: all .25s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- Leaflet marker tweaks ---- */
  .step-marker {
    background: var(--accent); color: #fff; border: 3px solid #fff;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.35);
  }
  .menu-pop {
    position: absolute; z-index: 40; right: 14px;
    background: var(--bg); border-radius: var(--radius); box-shadow: var(--shadow);
    display: none; flex-direction: column; overflow: hidden; min-width: 190px;
  }
  .menu-pop.open { display: flex; }
  .menu-pop button {
    background: none; border: none; text-align: left; padding: 13px 16px;
    font-size: 15px; color: var(--text); cursor: pointer;
  }
  .menu-pop button:active { background: var(--card); }

  @media (prefers-color-scheme: dark) {
    :root { --bg: #171b23; --text: #edeff3; --muted: #9aa2af; --card: #232936; }
    .sheet-handle::before { background: #3a4150; }
    .field input[type=text], .field input[type=datetime-local], .field textarea, .loc-btn { border-color: #3a4150; }
    .photo-add { border-color: #3a4150; }
    .loc-btn.sel { background: #33222a; }
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="topbar">
  <div class="chip">🌴 Zanzibar</div>
  <div class="spacer"></div>
  <button class="chip" id="trackBtn" onclick="toggleTracking()">📍 Track</button>
  <button class="chip" id="menuBtn" onclick="toggleMenu()">⋯</button>
</div>

<div class="menu-pop" id="menu" style="top: calc(58px + env(safe-area-inset-top));">
  <button onclick="exportTrip()">⬇️ Export backup (JSON)</button>
  <button onclick="document.getElementById('importFile').click(); toggleMenu()">⬆️ Import backup</button>
  <button onclick="fitTrip(); toggleMenu()">🗺 Fit map to trip</button>
  <button onclick="relive()">▶️ Relive trip</button>
  <button onclick="shareTrip()">📤 Share trip story</button>
  <button onclick="clearTrack()">🧹 Clear GPS trail</button>
</div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importTrip(this)">

<div class="fabs" id="fabs" style="bottom: 134px;">
  <button class="fab" onclick="locateMe()" title="My location">🧭</button>
  <button class="fab" onclick="quickSnap()" title="Snap a photo">📷</button>
  <button class="fab primary" onclick="openStepModal()" title="Add step">＋</button>
</div>

<!-- Bottom sheet: timeline -->
<div class="sheet collapsed" id="sheet">
  <div class="sheet-handle" onclick="toggleSheet()"></div>
  <div class="sheet-header" onclick="toggleSheet()">
    <h1>My Zanzibar Trip</h1>
    <div class="stats">
      <div class="stat"><b id="statSteps">0</b> steps</div>
      <div class="stat"><b id="statKm">0</b> km</div>
      <div class="stat"><b id="statDays">0</b> days</div>
      <div class="stat"><b id="statPhotos">0</b> photos</div>
    </div>
  </div>
  <div class="sheet-body" id="timeline"></div>
</div>

<!-- Add / edit step modal -->
<div class="modal-wrap" id="stepModalWrap" onclick="if(event.target===this) closeStepModal()">
  <div class="modal">
    <h2 id="stepModalTitle">Add a step</h2>
    <div class="field">
      <label>Title</label>
      <input type="text" id="fTitle" placeholder="e.g. Stone Town, Nungwi Beach…">
    </div>
    <div class="field">
      <label>When</label>
      <input type="datetime-local" id="fDate">
    </div>
    <div class="field">
      <label>Location</label>
      <div class="loc-row">
        <button class="loc-btn sel" id="locGps" onclick="setLocMode('gps')">📍 Current GPS</button>
        <button class="loc-btn" id="locMap" onclick="setLocMode('map')">🎯 Map center</button>
        <button class="loc-btn" id="locPhoto" onclick="setLocMode('photo')" style="display:none">📷 Photo</button>
      </div>
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="fNotes" placeholder="What happened here?"></textarea>
    </div>
    <div class="field">
      <label>Photos</label>
      <div class="loc-row">
        <button class="photo-add" style="flex:1" onclick="document.getElementById('fCamera').click()">📷 Take photo</button>
        <button class="photo-add" style="flex:1" onclick="document.getElementById('fPhotos').click()">🖼 Gallery</button>
      </div>
      <input type="file" id="fCamera" accept="image/*" capture="environment" style="display:none" onchange="addPhotos(this)">
      <input type="file" id="fPhotos" accept="image/*" multiple style="display:none" onchange="addPhotos(this)">
      <div class="photo-previews" id="photoPreviews"></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeStepModal()">Cancel</button>
      <button class="btn primary" onclick="saveStep()">Save step</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')"><img id="lightboxImg" alt=""></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
const STORE_KEY = "zanzibar-trip-v1";

/* ---------- State (IndexedDB, with legacy localStorage migration) ---------- */
let trip = { steps: [], track: [] };

function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("zanzibar-trip", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function loadTrip() {
  try {
    const db = await idb();
    const val = await new Promise((res, rej) => {
      const q = db.transaction("kv").objectStore("kv").get("trip");
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
    if (val && Array.isArray(val.steps)) return val;
  } catch (e) { console.warn("IndexedDB unavailable", e); }
  try { // migrate from the old localStorage version
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
let saveTimer = null;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }
async function saveNow() {
  const snapshot = JSON.parse(JSON.stringify(trip));
  try {
    const db = await idb();
    await new Promise((res, rej) => {
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(snapshot, "trip");
      tx.oncomplete = res;
      tx.onerror = () => rej(tx.error);
    });
    localStorage.removeItem(STORE_KEY); // legacy copy no longer needed
  } catch (e) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(snapshot)); }
    catch (e2) { toast("⚠️ Couldn't save — storage full. Export a backup!"); }
  }
}
window.addEventListener("pagehide", () => { if (saveTimer) { clearTimeout(saveTimer); saveNow(); } });

/* ---------- Map ---------- */
const map = L.map("map", { zoomControl: false }).setView([-6.1659, 39.3621], 10);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

const stepLayer = L.layerGroup().addTo(map);
const routeLine = L.polyline([], { color: "#e04148", weight: 4, opacity: .9 }).addTo(map);
const trackLine = L.polyline([], { color: "#e04148", weight: 3, opacity: .5, dashArray: "2 8" }).addTo(map);
let meMarker = null;

function stepIcon(n) {
  return L.divIcon({
    className: "", iconSize: [30, 30], iconAnchor: [15, 15],
    html: `<div class="step-marker" style="width:30px;height:30px">${n}</div>`
  });
}

function render() {
  // markers + route
  stepLayer.clearLayers();
  const sorted = [...trip.steps].sort((a, b) => a.date.localeCompare(b.date));
  sorted.forEach((s, i) => {
    L.marker([s.lat, s.lng], { icon: stepIcon(i + 1) })
      .addTo(stepLayer)
      .bindPopup(`<b>${esc(s.title)}</b><br>${fmtDate(s.date)}`);
  });
  routeLine.setLatLngs(sorted.map(s => [s.lat, s.lng]));
  trackLine.setLatLngs(trip.track.map(p => [p[0], p[1]]));

  // stats
  document.getElementById("statSteps").textContent = sorted.length;
  document.getElementById("statPhotos").textContent = sorted.reduce((n, s) => n + s.photos.length, 0);
  document.getElementById("statKm").textContent = totalKm(sorted).toFixed(0);
  document.getElementById("statDays").textContent = tripDays(sorted);

  // timeline
  const tl = document.getElementById("timeline");
  if (!sorted.length) {
    tl.innerHTML = `<div class="empty">No steps yet.<br>Tap <b>＋</b> to add your first stop —<br>karibu Zanzibar! 🏝</div>`;
    return;
  }
  tl.innerHTML = sorted.map((s, i) => `
    <div class="step-card">
      <div class="num">${i + 1}</div>
      <h3>${esc(s.title)}</h3>
      <div class="date">${fmtDate(s.date)}${s.weather ? ` · ${s.weather.icon} ${s.weather.tmax}°C · 🌇 ${s.weather.sunset}` : ""}</div>
      ${s.notes ? `<div class="notes">${esc(s.notes)}</div>` : ""}
      ${s.photos.length ? `<div class="photos">${s.photos.map((p, j) =>
        `<img src="${p}" loading="lazy" alt="" onclick="openLightbox('${s.id}',${j})">`).join("")}</div>` : ""}
      <div class="step-actions">
        <button onclick="flyToStep('${s.id}')">Show on map</button>
        <button onclick="openStepModal('${s.id}')">Edit</button>
        <button class="danger" onclick="deleteStep('${s.id}')">Delete</button>
      </div>
    </div>`).join("");
}

/* ---------- Stats helpers ---------- */
function haversine(a, b) {
  const R = 6371, toRad = d => d * Math.PI / 180;
  const dLat = toRad(b[0] - a[0]), dLng = toRad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function totalKm(sorted) {
  let km = 0;
  for (let i = 1; i < trip.track.length; i++) km += haversine(trip.track[i - 1], trip.track[i]);
  if (km > 0.5) return km; // prefer real GPS trail when available
  for (let i = 1; i < sorted.length; i++) km += haversine([sorted[i - 1].lat, sorted[i - 1].lng], [sorted[i].lat, sorted[i].lng]);
  return km;
}
function tripDays(sorted) {
  if (!sorted.length) return 0;
  const first = new Date(sorted[0].date), last = new Date(sorted[sorted.length - 1].date);
  return Math.max(1, Math.round((last - first) / 86400000) + 1);
}

/* ---------- Steps CRUD ---------- */
let editingId = null;
let pendingPhotos = [];
let locMode = "gps";

function openStepModal(id) {
  editingId = id || null;
  const s = id ? trip.steps.find(x => x.id === id) : null;
  document.getElementById("stepModalTitle").textContent = s ? "Edit step" : "Add a step";
  document.getElementById("fTitle").value = s ? s.title : "";
  document.getElementById("fNotes").value = s ? s.notes : "";
  document.getElementById("fDate").value = (s ? s.date : nowLocal()).slice(0, 16);
  pendingPhotos = s ? [...s.photos] : [];
  pendingExif = null;
  document.getElementById("locPhoto").style.display = "none";
  setLocMode(s ? "keep" : "gps");
  renderPhotoPreviews();
  document.getElementById("stepModalWrap").classList.add("open");
}
function closeStepModal() { document.getElementById("stepModalWrap").classList.remove("open"); }

function setLocMode(m) {
  locMode = m;
  document.getElementById("locGps").classList.toggle("sel", m === "gps");
  document.getElementById("locMap").classList.toggle("sel", m === "map" || m === "keep");
  document.getElementById("locPhoto").classList.toggle("sel", m === "photo");
  document.getElementById("locMap").textContent = m === "keep" ? "🎯 Keep pin" : "🎯 Map center";
}

async function saveStep() {
  const title = document.getElementById("fTitle").value.trim();
  if (!title) { toast("Give this step a title"); return; }
  const date = document.getElementById("fDate").value || nowLocal().slice(0, 16);
  const notes = document.getElementById("fNotes").value.trim();

  let lat, lng;
  if (locMode === "photo" && pendingExif) {
    ({ lat, lng } = pendingExif);
  } else if (locMode === "gps") {
    try {
      const pos = await getPosition();
      lat = pos.coords.latitude; lng = pos.coords.longitude;
    } catch (e) {
      toast("GPS unavailable — using map center");
      ({ lat, lng } = map.getCenter());
    }
  } else if (locMode === "keep") {
    const s = trip.steps.find(x => x.id === editingId);
    lat = s.lat; lng = s.lng;
  } else { // map center
    ({ lat, lng } = map.getCenter());
  }

  let step;
  if (editingId) {
    step = trip.steps.find(x => x.id === editingId);
    Object.assign(step, { title, date, notes, lat, lng, photos: pendingPhotos });
    delete step.weather; // location/date may have changed
  } else {
    step = { id: String(Date.now()), title, date, notes, lat, lng, photos: pendingPhotos };
    trip.steps.push(step);
  }
  save(); render(); closeStepModal();
  toast(editingId ? "Step updated ✓" : "Step added ✓");
  editingId = null;
  fetchWeather(step);
}

/* ---------- Weather + sunset per step (Open-Meteo, free, no key) ---------- */
const WMO = { 0:"☀️",1:"🌤",2:"⛅️",3:"☁️",45:"🌫",48:"🌫",51:"🌦",53:"🌦",55:"🌦",56:"🌦",57:"🌦",
  61:"🌧",63:"🌧",65:"🌧",66:"🌧",67:"🌧",71:"🌨",73:"🌨",75:"🌨",77:"🌨",
  80:"🌦",81:"🌧",82:"⛈",85:"🌨",86:"🌨",95:"⛈",96:"⛈",99:"⛈" };
async function fetchWeather(step) {
  if (!navigator.onLine || step.weather) return;
  try {
    const day = step.date.slice(0, 10);
    const ageDays = (Date.now() - new Date(day)) / 86400000;
    const host = ageDays > 85 ? "archive-api.open-meteo.com/v1/archive" : "api.open-meteo.com/v1/forecast";
    const url = `https://${host}?latitude=${step.lat.toFixed(4)}&longitude=${step.lng.toFixed(4)}` +
      `&daily=weather_code,temperature_2m_max,sunset&timezone=auto&start_date=${day}&end_date=${day}`;
    const r = await fetch(url);
    if (!r.ok) return;
    const d = (await r.json()).daily;
    if (!d || d.weather_code == null || d.weather_code[0] == null) return;
    step.weather = {
      icon: WMO[d.weather_code[0]] || "🌡",
      tmax: Math.round(d.temperature_2m_max[0]),
      sunset: String(d.sunset[0] || "").slice(11, 16)
    };
    save(); render();
  } catch (e) {} // offline or API hiccup — retried on next app start
}

function deleteStep(id) {
  if (!confirm("Delete this step and its photos?")) return;
  trip.steps = trip.steps.filter(s => s.id !== id);
  save(); render();
}

function flyToStep(id) {

/* ---------- EXIF: read GPS from the photo file itself ---------- */
async function photoExif(file) {
  try {
    const dv = new DataView(await file.slice(0, 262144).arrayBuffer());
    if (dv.byteLength < 12 || dv.getUint16(0) !== 0xFFD8) return null; // JPEG only
    let o = 2;
    while (o + 4 <= dv.byteLength) {
      if (dv.getUint8(o) !== 0xFF) break;
      const marker = dv.getUint8(o + 1);
      if (marker === 0xDA) break; // image data starts, no EXIF found
      const size = dv.getUint16(o + 2);
      if (marker === 0xE1 && dv.getUint32(o + 4) === 0x45786966) // "Exif"
        return tiffGps(dv, o + 10);
      o += 2 + size;
    }
  } catch (e) {}
  return null;
}
function tiffGps(dv, base) {
  const little = dv.getUint16(base) === 0x4949;
  const u16 = o => dv.getUint16(base + o, little);
  const u32 = o => dv.getUint32(base + o, little);
  if (u16(2) !== 42) return null;
  const ifd0 = u32(4);
  let gps = 0;
  for (let i = 0, n = u16(ifd0); i < n; i++) {
    const e = ifd0 + 2 + i * 12;
    if (u16(e) === 0x8825) { gps = u32(e + 8); break; } // GPS IFD pointer
  }
  if (!gps) return null;
  const tags = {};
  for (let i = 0, n = u16(gps); i < n; i++) {
    const e = gps + 2 + i * 12;
    const tag = u16(e);
    if (tag === 1 || tag === 3) tags[tag] = String.fromCharCode(dv.getUint8(base + e + 8)); // N/S, E/W
    if (tag === 2 || tag === 4) { // deg/min/sec rationals
      const vo = u32(e + 8);
      const rat = j => u32(vo + j * 8) / (u32(vo + j * 8 + 4) || 1);
      tags[tag] = rat(0) + rat(1) / 60 + rat(2) / 3600;
    }
  }
  if (typeof tags[2] !== "number" || typeof tags[4] !== "number") return null;
  const lat = tags[2] * (tags[1] === "S" ? -1 : 1);
  const lng = tags[4] * (tags[3] === "W" ? -1 : 1);
  if (!isFinite(lat) || !isFinite(lng) || (lat === 0 && lng === 0)) return null;
  return { lat, lng };
}

/* ---------- Photos ---------- */
let pendingExif = null;
async function addPhotos(input) {
  const files = [...input.files];
  if (!pendingExif) {
    for (const f of files) {
      pendingExif = await photoExif(f);
      if (pendingExif) break;
    }
    if (pendingExif) {
      document.getElementById("locPhoto").style.display = "";
      setLocMode("photo");
      toast("📷 Photo has a location — using it");
    }
  }
  files.forEach(file => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 1280; // IndexedDB has room for higher quality than the old localStorage version
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      pendingPhotos.push(c.toDataURL("image/jpeg", 0.78));
      URL.revokeObjectURL(url);
      renderPhotoPreviews();
    };
    img.src = url;
  });
  input.value = "";
}
function renderPhotoPreviews() {
  document.getElementById("photoPreviews").innerHTML = pendingPhotos.map((p, i) =>
    `<div class="pp"><img src="${p}" alt=""><button class="rm" onclick="pendingPhotos.splice(${i},1);renderPhotoPreviews()">×</button></div>`).join("");
}
function openLightbox(stepId, idx) {
  const s = trip.steps.find(x => x.id === stepId);
  if (!s) return;
  document.getElementById("lightboxImg").src = s.photos[idx];
  document.getElementById("lightbox").classList.add("open");
}

/* ---------- GPS tracking ---------- */
let watchId = null;
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    else if (!on && wakeLock) { wakeLock.release(); wakeLock = null; }
  } catch (e) {} // wake lock is best-effort
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && watchId !== null) keepAwake(true);
});
function toggleTracking() {
  const btn = document.getElementById("trackBtn");
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
    keepAwake(false);
    btn.classList.remove("tracking");
    btn.textContent = "📍 Track";
    toast("Tracking paused");
    return;
  }
  if (!navigator.geolocation) { toast("Geolocation not supported"); return; }
  watchId = navigator.geolocation.watchPosition(pos => {
    const p = [pos.coords.latitude, pos.coords.longitude];
    updateMe(p);
    const last = trip.track[trip.track.length - 1];
    if (!last || haversine(last, p) > 0.03) { // only record moves > 30 m
      trip.track.push([p[0], p[1], Date.now()]);
      trackLine.addLatLng(p);
      save(); render();
    }
  }, () => toast("Couldn't get GPS — check location permission"),
  { enableHighAccuracy: true, maximumAge: 10000 });
  btn.classList.add("tracking");
  btn.textContent = "📍 Tracking…";
  keepAwake(true);
  toast("Tracking on — screen will stay awake");
}
function clearTrack() {
  toggleMenu();
  if (!confirm("Clear the recorded GPS trail? Steps are kept.")) return;
  trip.track = [];
  save(); render();
}

function getPosition() {
  return new Promise((res, rej) =>
    navigator.geolocation
      ? navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 8000 })
      : rej(new Error("no geolocation")));
}
function updateMe(p) {
  if (!meMarker) {
    meMarker = L.circleMarker(p, { radius: 8, color: "#fff", weight: 3, fillColor: "#2563eb", fillOpacity: 1 }).addTo(map);
  } else meMarker.setLatLng(p);
}
async function locateMe() {
  try {
    const pos = await getPosition();
    const p = [pos.coords.latitude, pos.coords.longitude];
    updateMe(p);
    map.flyTo(p, 15, { duration: .8 });
  } catch (e) { toast("Couldn't get GPS — check location permission"); }
}

/* ---------- Share: self-contained read-only trip story ---------- */
function buildShareHtml() {
  const sorted = [...trip.steps].sort((a, b) => a.date.localeCompare(b.date));
  const json = JSON.stringify({ steps: sorted, track: trip.track }).replace(/<\//g, "<\\/");
  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Zanzibar Trip 🌴</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
 body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff;color:#1e2430}
 #map{height:48vh}
 .tl{max-width:640px;margin:0 auto;padding:18px 16px 40px}
 h1{font-size:22px;margin:0}
 .meta{color:#6b7280;font-size:14px;margin:6px 0 18px}
 .card{background:#f6f7f9;border-radius:14px;padding:14px;margin-bottom:14px;position:relative}
 .num{position:absolute;top:-8px;left:-4px;width:26px;height:26px;border-radius:50%;background:#e04148;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
 h3{margin:0;padding-left:14px;font-size:16px}
 .date{color:#6b7280;font-size:12px;padding-left:14px;margin-top:2px}
 .notes{font-size:14px;margin-top:8px;white-space:pre-wrap}
 .ph{display:flex;gap:8px;overflow-x:auto;margin-top:10px}
 .ph img{height:110px;border-radius:10px}
 .step-marker{background:#e04148;color:#fff;border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
 @media (prefers-color-scheme:dark){body{background:#171b23;color:#edeff3}.card{background:#232936}.notes{color:#edeff3}}
</style>
</head>
<body>
<div id="map"></div>
<div class="tl"><h1>My Zanzibar Trip 🌴</h1><div class="meta" id="meta"></div><div id="cards"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>
<script>
var TRIP=${json};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fd(s){return new Date(s).toLocaleString(undefined,{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
var map=L.map("map");
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);
var pts=[];
TRIP.steps.forEach(function(s,i){
 pts.push([s.lat,s.lng]);
 L.marker([s.lat,s.lng],{icon:L.divIcon({className:"",iconSize:[30,30],iconAnchor:[15,15],html:'<div class="step-marker" style="width:30px;height:30px">'+(i+1)+'</div>'})}).addTo(map).bindPopup("<b>"+esc(s.title)+"</b>");
});
L.polyline(pts,{color:"#e04148",weight:4,opacity:.9}).addTo(map);
if(TRIP.track&&TRIP.track.length)L.polyline(TRIP.track.map(function(p){return[p[0],p[1]]}),{color:"#e04148",weight:3,opacity:.5,dashArray:"2 8"}).addTo(map);
if(pts.length)map.fitBounds(L.latLngBounds(pts).pad(.2));else map.setView([-6.1659,39.3621],10);
function hav(a,b){var t=function(d){return d*Math.PI/180};var dl=t(b[0]-a[0]),dg=t(b[1]-a[1]);var h=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dg/2)*Math.sin(dg/2);return 12742*Math.asin(Math.sqrt(h))}
var km=0,tr=TRIP.track||[],i;
for(i=1;i<tr.length;i++)km+=hav(tr[i-1],tr[i]);
if(km<.5)for(i=1;i<pts.length;i++)km+=hav(pts[i-1],pts[i]);
var days=TRIP.steps.length?Math.max(1,Math.round((new Date(TRIP.steps[TRIP.steps.length-1].date)-new Date(TRIP.steps[0].date))/864e5)+1):0;
document.getElementById("meta").textContent=TRIP.steps.length+" steps · "+km.toFixed(0)+" km · "+days+" days";
document.getElementById("cards").innerHTML=TRIP.steps.map(function(s,i){
 return '<div class="card"><div class="num">'+(i+1)+'</div><h3>'+esc(s.title)+'</h3><div class="date">'+fd(s.date)+
  (s.weather?" · "+s.weather.icon+" "+s.weather.tmax+"°C · 🌇 "+s.weather.sunset:"")+"</div>"+
  (s.notes?'<div class="notes">'+esc(s.notes)+"</div>":"")+
  (s.photos&&s.photos.length?'<div class="ph">'+s.photos.map(function(p){return '<img src="'+p+'" alt="">'}).join("")+"</div>":"")+"</div>";
}).join("");
<\/script>
</body>
</html>`;
}
async function shareTrip() {
  toggleMenu();
  if (!trip.steps.length) { toast("Add some steps first"); return; }
  const html = buildShareHtml();
  const file = new File([html], "my-zanzibar-trip.html", { type: "text/html" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: "My Zanzibar Trip" });
      return;
    } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  a.download = "my-zanzibar-trip.html";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Story downloaded — send the file to anyone");
}

/* ---------- Export / import ---------- */
function exportTrip() {
  toggleMenu();
  const blob = new Blob([JSON.stringify(trip)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `zanzibar-trip-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importTrip(input) {
  const file = input.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data.steps)) throw new Error("bad file");
      trip = { steps: data.steps, track: Array.isArray(data.track) ? data.track : [] };
      save(); render(); fitTrip();
      toast("Trip restored ✓");
    } catch (e) { toast("That file doesn't look like a trip backup"); }
  };
  r.readAsText(file);
  input.value = "";
}

/* ---------- UI helpers ---------- */
function toggleSheet() { setSheet(document.getElementById("sheet").classList.contains("collapsed")); }
function setSheet(open) {
  document.getElementById("sheet").classList.toggle("collapsed", !open);
  document.getElementById("fabs").style.bottom = open ? "-90px" : "134px";
}
function toggleMenu() { document.getElementById("menu").classList.toggle("open"); }
function fitTrip() {
  const pts = trip.steps.map(s => [s.lat, s.lng]).concat(trip.track.map(p => [p[0], p[1]]));
  if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.2));
}

/* ---------- Relive: fly through the trip step by step ---------- */
let reliving = false;
async function relive() {
  toggleMenu();
  const sorted = [...trip.steps].sort((a, b) => a.date.localeCompare(b.date));
  if (!sorted.length) { toast("Add some steps first"); return; }
  if (reliving) { reliving = false; return; }
  reliving = true;
  setSheet(false);
  map.closePopup();
  fitTrip();
  await sleep(1200);
  for (let i = 0; i < sorted.length && reliving; i++) {
    const s = sorted[i];
    map.flyTo([s.lat, s.lng], 13, { duration: 1.6 });
    toast(`${i + 1}/${sorted.length} · ${s.title}`);
    await sleep(2400);
  }
  reliving = false;
  fitTrip();
}
map.on("dragstart", () => { reliving = false; }); // let the user grab the map to stop
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function nowLocal() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString();
}
function fmtDate(s) {
  return new Date(s).toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function esc(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
document.addEventListener("click", e => {
  if (!e.target.closest("#menu") && !e.target.closest("#menuBtn"))
    document.getElementById("menu").classList.remove("open");
});

/* ---------- Startup ---------- */
(async () => {
  const saved = await loadTrip();
  if (saved) trip = { steps: saved.steps || [], track: saved.track || [] };
  render();
  if (trip.steps.length || trip.track.length) fitTrip();
  if (saved) saveNow(); // ensures data migrated from localStorage lands in IndexedDB
  trip.steps.filter(s => !s.weather).forEach(fetchWeather); // backfill weather when online
})();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(e => console.warn("SW registration failed", e));
}
</script>
